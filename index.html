<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Te Amo - Nuestro Scrapbook</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --burgundy: #591624;
            --burgundy-dark: #3f0e19;
            --cream: #FDFBF7;
            --accent-gold: #D4AF37;
            --text-main: #332225;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--burgundy);
            color: var(--text-main);
            font-family: 'Quicksand', sans-serif;
            min-height: 100vh;
            padding: 16px 12px 40px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .floating-heart {
            position: fixed;
            color: #ff5c75;
            font-size: 1.2rem;
            user-select: none;
            pointer-events: none;
            z-index: 9999;
            animation: floatUp 3s linear forwards;
            opacity: 0.8;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.6) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-120px) scale(1.4) rotate(30deg); opacity: 0; }
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            padding-top: 10px;
            width: 100%;
        }

        .title-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 4px;
        }

        .side-heart {
            font-size: 1.5rem;
            color: #ff768c;
            animation: sideHeartBeat 1.5s infinite ease-in-out;
        }

        @keyframes sideHeartBeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            color: var(--cream);
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 0.95rem;
            color: #E8D5D8;
            font-style: italic;
            font-family: 'Playfair Display', serif;
        }

        .gallery {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .polaroid {
            background-color: var(--cream);
            padding: 12px 12px 28px 12px;
            border-radius: 4px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
            transform: rotate(var(--rot, 0deg));
        }

        .polaroid:nth-child(even) { --rot: 1.5deg; }
        .polaroid:nth-child(odd) { --rot: -1.5deg; }

        .polaroid img {
            width: 100%;
            height: 360px;
            object-fit: cover;
            border-radius: 2px;
            display: block;
        }

        .polaroid-caption {
            text-align: center;
            font-family: 'Playfair Display', serif;
            font-size: 1rem;
            color: var(--burgundy-dark);
            margin-top: 12px;
            font-style: italic;
        }

        footer {
            margin-top: 35px;
            text-align: center;
            color: #E8D5D8;
            font-size: 0.8rem;
            font-family: 'Playfair Display', serif;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="title-wrapper">
                <span class="side-heart">💖</span>
                <h1>Te Amo</h1>
                <span class="side-heart">💖</span>
            </div>
            <div class="subtitle">Nuestra historia en recuerdos</div>
        </header>

        <!-- Galería fija con todas tus fotos -->
        <div class="gallery" id="gallery">
            <div class="polaroid">
                <img src="5D41-BEC0-4131-B87B-0349A9BA4FB3.jpeg" alt="Recuerdo">
                <div class="polaroid-caption">Nuestro amor</div>
            </div>
            <div class="polaroid">
                <img src="132901B1-7332-4B33-9B62-2F67DDE6DEC2.jpeg" alt="Recuerdo">
                <div class="polaroid-caption">Momentos juntos</div>
            </div>
            <div class="polaroid">
                <img src="4DA3BE3C-4C16-44E5-BA0F-EBB8CA1357BD.jpeg" alt="Recuerdo">
                <div class="polaroid-caption">Contigo siempre</div>
            </div>
            <div class="polaroid">
                <img src="5E55279D-EE1C-4840-9A88-0E84FEB56632.jpeg" alt="Recuerdo">
                <div class="polaroid-caption">Instantes mágicos</div>
            </div>
            <div class="polaroid">
                <img src="74B12FFA-D7DC-42C0-B762-F54E5F5F79B4.jpeg" alt="Recuerdo">
                <div class="polaroid-caption">Tu sonrisa</div>
            </div>
            <div class="polaroid">
                <img src="8320CCAF-9BEC-4D03-8BF8-2EF52CC25B18.jpeg" alt="Recuerdo">
                <div class="polaroid-caption">Felicidad pura</div>
            </div>
            <div class="polaroid">
                <img src="9310F49A-6EA6-4B42-BDF1-2DEF9FD12752.jpeg" alt="Recuerdo">
                <div class="polaroid-caption">Compañeros de vida</div>
            </div>
            <div class="polaroid">
                <img src="93415DDF-6654-4184-B5C7-8E30CD7DAE09.jpeg" alt="Recuerdo">
                <div class="polaroid-caption">Días hermosos</div>
            </div>
            <div class="polaroid">
                <img src="AD43681C-BD52-4A06-9A74-500A91CDD8CB.jpeg" alt="Recuerdo">
                <div class="polaroid-caption">Nuestro refugio</div>
            </div>
            <div class="polaroid">
                <img src="CA02EEBD-8B00-4C0F-81A7-299CF13198BD.jpeg" alt="Recuerdo">
                <div class="polaroid-caption">Por siempre</div>
            </div>
            <div class="polaroid">
                <img src="E188EAE7-B134-4674-8D2F-654383A10375.jpeg" alt="Recuerdo">
                <div class="polaroid-caption">Te amo</div>
            </div>
        </div>

        <footer>Creado con todo el amor del mundo para ti 💖</footer>
    </div>

    <script>
        window.onload = function() {
            setupHeartRain();
        };

        let moveCounter = 0;
        function setupHeartRain() {
            window.addEventListener('scroll', function() {
                moveCounter++;
                if (moveCounter % 6 === 0) {
                    createHeart(window.innerWidth * Math.random(), window.scrollY + window.innerHeight - 50);
                }
            });
            window.addEventListener('click', function(e) {
                createHeart(e.clientX, e.clientY);
            });
        }

        function createHeart(x, y) {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.innerHTML = '❤️';
            heart.style.left = x + 'px';
            heart.style.top = y + 'px';
            document.body.appendChild(heart);
            setTimeout(function() {
                heart.remove();
            }, 3000);
        }
    </script>
</body>
</html>
